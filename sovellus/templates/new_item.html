{% extends "layout.html" %}

{% block title %}Uusi resepti{% endblock %}

{% block content %}
<h2>Uusi resepti</h2>


<form action="/create_item" method="post">
  <p>
    <label for="title">Reseptin nimi</label>: <br />
    <input type="text" name="title" id="title" maxlength="50" required />
  </p>
  <p>
    <label for="description">kuvaus</label>: <br />
    <textarea name = "description" id="description" rows="8" cols="60" maxlength="500" required></textarea>
  </p>
  <p>
    <label for="ingredients">ainesosat</label>: <br />
    <textarea name = "ingredients" id="ingredients" rows="10" cols="40" maxlength=1000 required></textarea>
  </p>
  <p>
    <label for="instructions">ohje</label>: <br />
    <textarea name = "instructions" id="instructions" rows="15" cols="60" maxlength=2000 required></textarea>
  </p>

  {% for class in classes %}
  <p>
    <label for="class{{ class }}">{{ class }}</label>: <br />
    <select name="classes" id="class{{ class }}">
      <option value="">(valitse)</option>
    {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Lisää resepti" />
</form>
{% endblock %}
