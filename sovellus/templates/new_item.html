<!DOCTYPE html>
<html>

<head>
  <title>Uusi resepti</title>
</head>

<body>
  <h1>Uusi resepti</h1>


  <form action="/create_item" method="post">
    <p>
      Reseptin nimi: <br />
      <input type="text" name="title" maxlength="50" required />
    </p>
    <p>
      kuvaus: <br />
      <textarea name = "description" rows="8" cols="60" maxlength="500" required></textarea>
    </p>
    <p>
      ainesosat: <br />
      <textarea name = "ingredients" rows="10" cols="40" maxlength=1000 required></textarea>
    </p>
    <p>
      ohje: <br />
      <textarea name = "instructions" rows="15" cols="60" maxlength=2000 required></textarea>
    </p>

    {% for class in classes %}
    <p>
      {{class}}: <br />
      <select name="classes">
        <option value="">(valitse)</option>
      {% for option in classes[class] %}
        <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endfor %}
      </select>
    </p>
    {% endfor %}
    
    <input type="submit" value="Lisää resepti" />
  </form>
</body>

</html>
