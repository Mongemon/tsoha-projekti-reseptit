{% extends "layout.html" %}

{% block title %}Reseptikirja{% endblock %}

{% block content %}


<h2>Reseptejä</h2>
<ul>
{% for recipe in recipes %}
<div class="recipe">
<a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a> <br />
Tekijä: <a href="/user/{{ recipe.user_id }}">{{ recipe.username }}</a>
</div>
{% endfor %}
</ul>


{% endblock %}
