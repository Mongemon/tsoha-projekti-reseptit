{% extends "layout.html" %}

{% block title %}Hae resepti{% endblock %}

{% block content %}

<h2>Etsi resepti</h2>
<form action="/find_recipe" method="get">
  <p>
    <label for="query">Hakusana</label>: <input type="text" name="query" id="query" value="{{query}}">
  </p>
  <input type="submit" value="lähtetä">
</form>

{% if query %}
<h3>Tulokset</h3>

<ul>
  {% for recipe in results %}
  <li><a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a></li>
  {% endfor %}
</ul>

{% endif %}

<p>
  <a href="/">Takaisin</a>
</p>

{% endblock %}
