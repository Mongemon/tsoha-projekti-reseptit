<!DOCTYPE html>
<html>

<head>
  <title>{{ recipe.title }}</title>
</head>

<body>
  <h1>{{ recipe.title }}</h1>

  {% if session.user_id == recipe.user_id%}
  <p>
    <a href="/edit_recipe/{{ recipe.id}}"> Muokkaa </a>
    <a href="/remove_recipe/{{ recipe.id}}"> Poista </a>
  </p>
  {% endif %}

  <p> 
    {{ recipe.description }}
  </p>
  <p>
    Ainesosat: {{ recipe.ingredients }}
  </p>
  <p>
    Ohjeet: {{ recipe.instructions }}
  </p>
  <p>
    Tekijä: <a href="/user/{{ recipe.user_id }}">{{ recipe.username }}</a>
  </p>
  <p>
    <a href="/">Takaisin</a>
  </p>


</body>

</html>
