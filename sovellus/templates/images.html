<!DOCTYPE html>
<html>

<head>
  <title>Ilmoituksen kuvat</title>
</head>

<body>
  <h1>Ilmoituksen kuvat</h1>

  <p>
    Ilmoituksessa on {{ images | count }} kuvaa.
  </p>

  <h2>Lisää uusi kuva</h2>
  <form action="/add_image" method="post" enctype="multipart/form-data">
    <p>
      Kuva: <input type="file" name="image" accept=".jpg" />
    </p>
    <input type="hidden" name="recipe_id" value="{{ recipe_id }}">
    <input type="submit" value="Lähetä" />
  </form>



  <p>
    <a href="/">Takaisin</a>
  </p>

</body>

</html>
