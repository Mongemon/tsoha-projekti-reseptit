<!DOCTYPE html>
<html>

<head>
  <title>Reseptin muokkaus</title>
</head>

<body>
  <h1>Reseptin muokkaus</h1>


  <form action="/update_recipe" method="post">
    <p>
      Reseptin nimi: <br />
      <input type="text" name="title" value="{{ recipe.title }}"/>
    </p>
    <p>
      kuvaus: <br />
      <textarea name = "description" rows="8" cols="60">{{recipe.description}}</textarea>
    </p>
    <p>
      ainesosat: <br />
      <textarea name = "ingredients" rows="10" cols="40">{{recipe.ingredients}}</textarea>
    </p>
    <p>
      ohje: <br />
      <textarea name = "instructions" rows="15" cols="60">{{recipe.instructions}}</textarea>
    </p>
    
    <input type="hidden" name="recipe_id" value="{{ recipe.id }}" />
    <input type="submit" value="Päivitä resepti" />
  </form>
</body>

</html>
